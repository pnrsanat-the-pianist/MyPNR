    <title>MyPNR - PNR Sanat Akademisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              pnr: {
                purple: '#6B21A8',
                indigo: '#4F46E5',
                blue: '#3B82F6',
                cyan: '#06B6D4',
                teal: '#14B8A6',
                green: '#22C55E',
                lime: '#84CC16',
                yellow: '#EAB308',
                orange: '#F97316',
                red: '#EF4444',
                dark: '#0f172a',
                card: '#1e293b',
              }
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
              display: ['Comfortaa', 'cursive'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Background managed by Tailwind classes on #root or html */
      }
      /* Custom scrollbar for sidebar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 3px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #334155; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* PRINT STYLES */
      @media print {
        @page {
          size: A4;
          margin: 10mm;
        }
        
        body {
          background-color: white !important;
          color: black !important;
        }

        /* Hide everything by default */
        body * {
          visibility: hidden;
        }

        /* Show only the contract preview and its children */
        #contract-preview, #contract-preview * {
          visibility: visible;
        }

        /* Position the contract at the top-left of the page */
        #contract-preview {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background-color: white !important;
          box-shadow: none !important;
          border: none !important;
          transform: none !important; /* Reset any UI scaling */
        }

        /* Ensure images print */
        img {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }
    </style>
