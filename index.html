<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyPNR - PNR Sanat Akademisi</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Background managed by Tailwind classes on #root or html */
    }

    /* Custom scrollbar for sidebar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* PRINT STYLES */
    @media print {
      @page {
        size: A4;
        margin: 10mm;
        /* Standard A4 margin */
      }

      /* Reset background and colors for print */
      html,
      body {
        background-color: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      /* Hide all application UI elements */
      #root>div>header,
      #root>div>aside,
      #root>div>div>header,
      .no-print,
      button,
      input,
      select,
      textarea {
        display: none !important;
      }

      /* Hide everything by default inside root */
      body * {
        visibility: hidden;
      }

      /* Show only the contract preview and its specific children */
      #contract-preview,
      #contract-preview * {
        visibility: visible;
      }

      /* Position the contract preview for perfect A4 output */
      #contract-preview {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 10mm !important;
        /* Print-specific padding */
        background-color: white !important;
        box-shadow: none !important;
        border: none !important;
        transform: none !important;
        overflow: visible !important;
      }

      /* Ensure images and colors print correctly */
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
